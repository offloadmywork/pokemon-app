<svg xmlns="http://www.w3.org/2000/svg" width="96" height="192" viewBox="0 0 96 192" shape-rendering="crispEdges">
  <rect width="96" height="192" fill="transparent" />
  <!-- Each frame is 48x48. Rows: down, left, right, up. Cols: idle, walk. -->

  <!-- DOWN idle (0,0) -->
  <g transform="translate(0 0)">
    <rect x="20" y="24" width="8" height="14" rx="2" fill="#3b82f6" />
    <circle cx="24" cy="18" r="6" fill="#fbbf24" />
    <rect x="16" y="38" width="6" height="8" fill="#1f2937" />
    <rect x="26" y="38" width="6" height="8" fill="#1f2937" />
  </g>
  <!-- DOWN walk (48,0) -->
  <g transform="translate(48 0)">
    <rect x="20" y="24" width="8" height="14" rx="2" fill="#3b82f6" />
    <circle cx="24" cy="18" r="6" fill="#fbbf24" />
    <rect x="14" y="38" width="6" height="8" fill="#1f2937" />
    <rect x="28" y="38" width="6" height="8" fill="#1f2937" />
  </g>

  <!-- LEFT idle (0,48) -->
  <g transform="translate(0 48)">
    <rect x="20" y="24" width="8" height="14" rx="2" fill="#10b981" />
    <circle cx="22" cy="18" r="6" fill="#fbbf24" />
    <rect x="14" y="28" width="6" height="4" fill="#0f172a" />
    <rect x="18" y="38" width="6" height="8" fill="#1f2937" />
    <rect x="28" y="38" width="6" height="8" fill="#1f2937" />
  </g>
  <!-- LEFT walk (48,48) -->
  <g transform="translate(48 48)">
    <rect x="20" y="24" width="8" height="14" rx="2" fill="#10b981" />
    <circle cx="22" cy="18" r="6" fill="#fbbf24" />
    <rect x="14" y="28" width="6" height="4" fill="#0f172a" />
    <rect x="16" y="38" width="6" height="8" fill="#1f2937" />
    <rect x="30" y="38" width="6" height="8" fill="#1f2937" />
  </g>

  <!-- RIGHT idle (0,96) -->
  <g transform="translate(0 96)">
    <rect x="20" y="24" width="8" height="14" rx="2" fill="#ef4444" />
    <circle cx="26" cy="18" r="6" fill="#fbbf24" />
    <rect x="28" y="28" width="6" height="4" fill="#0f172a" />
    <rect x="18" y="38" width="6" height="8" fill="#1f2937" />
    <rect x="28" y="38" width="6" height="8" fill="#1f2937" />
  </g>
  <!-- RIGHT walk (48,96) -->
  <g transform="translate(48 96)">
    <rect x="20" y="24" width="8" height="14" rx="2" fill="#ef4444" />
    <circle cx="26" cy="18" r="6" fill="#fbbf24" />
    <rect x="28" y="28" width="6" height="4" fill="#0f172a" />
    <rect x="16" y="38" width="6" height="8" fill="#1f2937" />
    <rect x="30" y="38" width="6" height="8" fill="#1f2937" />
  </g>

  <!-- UP idle (0,144) -->
  <g transform="translate(0 144)">
    <rect x="20" y="24" width="8" height="14" rx="2" fill="#8b5cf6" />
    <circle cx="24" cy="18" r="6" fill="#fbbf24" />
    <rect x="18" y="20" width="12" height="4" fill="#0f172a" />
    <rect x="18" y="38" width="6" height="8" fill="#1f2937" />
    <rect x="28" y="38" width="6" height="8" fill="#1f2937" />
  </g>
  <!-- UP walk (48,144) -->
  <g transform="translate(48 144)">
    <rect x="20" y="24" width="8" height="14" rx="2" fill="#8b5cf6" />
    <circle cx="24" cy="18" r="6" fill="#fbbf24" />
    <rect x="18" y="20" width="12" height="4" fill="#0f172a" />
    <rect x="16" y="38" width="6" height="8" fill="#1f2937" />
    <rect x="30" y="38" width="6" height="8" fill="#1f2937" />
  </g>
